name: konekta_mobile
description: KONEKTA passenger + driver mobile app (single codebase, role-based).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_putih.png
  # Manrope/HankenGrotesk-Variable.ttf are single variable-font files;
  # listing the same asset under multiple `weight:` entries makes Flutter
  # pick the matching weight axis instance instead of always rendering
  # the default weight.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
          weight: 700
